<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Kuroro">
<meta name="theme-color" content="#0f0a0c">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:0}body{margin:0}</style>
<title>Kuroro</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=Saira+Condensed:wght@500;600;700&display=swap">
<style>
/* Layout : appli mobile d'une colonne ; barre d'onglets en bas comme une appli iPhone ; accueil = tableau de bord du jour. */
:root{
  --bg:#eef1f4; --surface:#ffffff; --surface2:#f6f8fa; --ink:#121820; --muted:#5b6672; --line:#d9dfe6;
  --accent:#a3242f; --accent-ink:#ffffff; --code-ink:#ffffff;
  --jjb:#cf3f2b; --jjb-soft:#fbe7e3; --muscu:#c27a0e; --muscu-soft:#fdf0d9; --walk:#23825a; --walk-soft:#e2f3ea; --deload:#7d4fc0; --deload-soft:#efe8fb;
  --c-batch:#2457c5; --c-dim:#23825a; --c-diner:#0d7584; --c-snack:#7d4fc0; --c-plaisir:#c43f7f; --c-express:#55606d;
  --ok:#23825a; --warn:#b4530f; --shadow:0 1px 2px rgba(18,24,32,.06),0 4px 14px rgba(18,24,32,.05);
  --f-display:"Saira Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  --tabh:64px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0f0a0c; --surface:#1a1316; --surface2:#22191d; --ink:#efe8ea; --muted:#a2959a; --line:#33272b;
  --accent:#ff5d6a; --accent-ink:#1a0a0d; --code-ink:#0f0a0c;
  --jjb:#ff6a52; --jjb-soft:#3a1d18; --muscu:#f4b13f; --muscu-soft:#3a2c12; --walk:#4cc48c; --walk-soft:#15301f; --deload:#b48cf2; --deload-soft:#2a2040;
  --c-batch:#7aa2ff; --c-dim:#4cc48c; --c-diner:#3fc1d1; --c-snack:#b48cf2; --c-plaisir:#f07db2; --c-express:#a3afbb;
  --ok:#4cc48c; --warn:#f0a35a; --shadow:none; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#0f0a0c; --surface:#1a1316; --surface2:#22191d; --ink:#efe8ea; --muted:#a2959a; --line:#33272b;
  --accent:#ff5d6a; --accent-ink:#1a0a0d; --code-ink:#0f0a0c;
  --jjb:#ff6a52; --jjb-soft:#3a1d18; --muscu:#f4b13f; --muscu-soft:#3a2c12; --walk:#4cc48c; --walk-soft:#15301f; --deload:#b48cf2; --deload-soft:#2a2040;
  --c-batch:#7aa2ff; --c-dim:#4cc48c; --c-diner:#3fc1d1; --c-snack:#b48cf2; --c-plaisir:#f07db2; --c-express:#a3afbb;
  --ok:#4cc48c; --warn:#f0a35a; --shadow:none; color-scheme:dark }

*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
.wrap{max-width:980px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
main{padding-block:14px calc(var(--tabh) + 40px + env(safe-area-inset-bottom,0px))}
h1,h2,h3{text-wrap:balance;margin:0}
a:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,label:focus-within{outline:2px solid var(--accent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.muted,.note{color:var(--muted)} .note{font-size:13px}
.eyebrow{font-size:11.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:700;padding:3px 9px;border-radius:999px;background:var(--surface2);border:1px solid var(--line);white-space:nowrap}
.chip.deload{background:var(--deload-soft);color:var(--deload);border-color:transparent}
.code{font-family:var(--f-display);font-weight:700;font-size:13px;letter-spacing:.03em;padding:1px 6px;border-radius:5px;color:var(--code-ink);background:var(--cc,var(--c-express))}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.panel h3{font-size:15px;margin-bottom:10px;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.panel h3 .link{font-size:13px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 14px;font-weight:600;font-size:14px;cursor:pointer}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.warn{border-color:var(--jjb);color:var(--jjb)}
button.link{background:none;border:0;padding:0;color:var(--accent);font-weight:700;cursor:pointer}
.rules{margin:0;padding-left:18px;font-size:13.5px;display:flex;flex-direction:column;gap:5px}
.pagehead{display:flex;flex-wrap:wrap;gap:4px 16px;align-items:baseline;margin-bottom:12px}
.pagehead h1{font-family:var(--f-display);font-weight:700;font-size:clamp(30px,7vw,42px);text-transform:uppercase;line-height:1}
.pagehead p{margin:0;color:var(--muted);font-size:14px}
.seg{display:flex;gap:4px;flex-wrap:wrap;margin:0 0 14px}
.seg button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 13px;font-weight:600;font-size:13.5px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.seg .cur{font-size:10.5px;font-weight:700;margin-left:5px;color:var(--accent)}
.seg button[aria-pressed="true"] .cur{color:var(--bg)}
.grid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px}
@media (max-width:760px){.grid2{grid-template-columns:1fr}}
.stack{display:flex;flex-direction:column;gap:12px;min-width:0}
input[type=text],input[type=date],input[type=number],input[type=search],textarea,select{border:1px solid var(--line);background:var(--surface2);border-radius:10px;padding:9px 11px;font-size:16px;width:100%;color:var(--ink)}
textarea{min-height:200px;resize:vertical;line-height:1.5}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--tabh) + 16px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:999px;font-weight:600;font-size:14px;z-index:30}

/* barre d'onglets */
nav.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:15;background:var(--surface);border-top:1px solid var(--line);padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px));display:grid;grid-template-columns:repeat(5,1fr)}
nav.tabbar a{display:flex;flex-direction:column;align-items:center;gap:2px;text-decoration:none;color:var(--muted);font-size:11px;font-weight:700;padding:4px 0;border-radius:10px}
nav.tabbar a svg{width:24px;height:24px}
nav.tabbar a[aria-current="page"]{color:var(--accent)}

/* accueil */
.hello{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;margin-bottom:12px}
.hello h1{font-family:var(--f-display);font-weight:700;font-size:clamp(32px,8vw,46px);line-height:.95;text-transform:uppercase}
.hello .d{color:var(--muted);font-weight:500;margin-top:4px}
.next{background:var(--ink);color:var(--bg);border-radius:14px;padding:14px 16px;display:flex;gap:14px;align-items:center;margin-bottom:14px;cursor:pointer;border:0;width:100%;text-align:left}
.next .t{font-family:var(--f-display);font-weight:700;font-size:30px;line-height:1}
.next .l{font-size:12px;text-transform:uppercase;letter-spacing:.08em;opacity:.7;font-weight:700}
.next .n{font-weight:700;font-size:16px;line-height:1.25}
.tl{display:flex;flex-direction:column}
.tlr{display:grid;grid-template-columns:52px 10px minmax(0,1fr);gap:10px;align-items:start;padding:7px 0;background:none;border:0;text-align:left;cursor:pointer;width:100%}
.tlr .t{font-family:var(--f-display);font-weight:700;font-size:17px;text-align:right;font-variant-numeric:tabular-nums;line-height:1.2}
.tlr .dot{width:10px;height:10px;border-radius:50%;margin-top:6px;background:var(--cc,var(--muted))}
.tlr .x{font-size:14.5px;font-weight:600;line-height:1.3}
.tlr .x small{display:block;font-weight:500;color:var(--muted);font-size:12.5px}
.tlr.past{opacity:.5}
.hab{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px}
.hbtn{border:1.5px solid var(--line);background:var(--surface2);border-radius:12px;padding:10px 12px;text-align:left;cursor:pointer;display:flex;gap:9px;align-items:center;font-weight:600;font-size:14px;line-height:1.25}
.hbtn .ck{width:22px;height:22px;border-radius:7px;border:2px solid var(--line);flex:none;display:grid;place-items:center;font-size:14px;color:var(--accent-ink)}
.hbtn[aria-pressed="true"]{border-color:var(--ok);background:var(--walk-soft)}
.hbtn[aria-pressed="true"] .ck{background:var(--ok);border-color:var(--ok)}
.kpis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.kpi{background:var(--surface2);border-radius:11px;padding:10px 12px;min-width:0}
.kpi b{font-family:var(--f-display);font-size:26px;display:block;line-height:1.05}
.kpi span{font-size:11.5px;color:var(--muted)}
.qw{display:flex;gap:8px;margin-top:10px}
.qw input{flex:1}

/* tâches */
.task{display:grid;grid-template-columns:28px minmax(0,1fr) auto;gap:10px;align-items:center;padding:9px 0;border-top:1px solid var(--line)}
.task:first-child{border-top:0}
.task input[type=checkbox]{width:22px;height:22px;accent-color:var(--ok);margin:0}
.task .tt{font-weight:600;font-size:15px;line-height:1.3;word-break:break-word}
.task .tm{font-size:12.5px;color:var(--muted)}
.task .tm .late{color:var(--jjb);font-weight:700}
.task.done .tt{text-decoration:line-through;color:var(--muted)}
.task .del{border:0;background:none;color:var(--muted);cursor:pointer;font-size:13px;padding:4px}
.addrow{display:grid;grid-template-columns:minmax(0,1fr) 150px 130px auto;gap:8px;margin-bottom:12px}
@media (max-width:640px){.addrow{grid-template-columns:1fr 1fr}.addrow input[type=text]{grid-column:1 / -1}.addrow .btn{grid-column:1 / -1}}

/* habitudes */
.hrow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.hrow:first-child{border-top:0}
.heat{display:grid;grid-template-columns:repeat(30,minmax(0,1fr));gap:2px;margin-top:6px}
.heat i{display:block;aspect-ratio:1;border-radius:3px;background:var(--surface2);border:1px solid var(--line)}
.heat i.on{background:var(--ok);border-color:var(--ok)}
.streak{font-family:var(--f-display);font-weight:700;font-size:20px;text-align:right;line-height:1}
.streak small{display:block;font-family:var(--f-body);font-size:11px;color:var(--muted);font-weight:600}

/* notes */
.nlist{display:flex;flex-direction:column;gap:8px}
.ncard{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:11px 14px;text-align:left;cursor:pointer}
.ncard b{display:block;font-size:15.5px}
.ncard span{font-size:13px;color:var(--muted);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}

/* jour sport / repas */
.strip{display:grid;grid-template-columns:auto repeat(7,minmax(0,1fr)) auto;gap:5px;margin:4px 0 12px}
.strip .arrow{width:32px;border:1px solid var(--line);background:var(--surface);border-radius:10px;cursor:pointer;font-size:18px}
.dbtn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:6px 1px 7px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;min-width:0}
.dbtn .dn{font-size:10.5px;font-weight:700;text-transform:uppercase;color:var(--muted)}
.dbtn .dd{font-family:var(--f-display);font-weight:700;font-size:19px;line-height:1}
.dbtn .dt{font-size:9.5px;font-weight:700;height:13px}
.dt.j{color:var(--jjb)} .dt.m{color:var(--muscu)} .dt.w{color:var(--walk)}
.dbtn[aria-pressed="true"]{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.dbtn.today .dd{color:var(--accent)}
.dayttl{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;margin-bottom:6px}
.dayttl h2{font-family:var(--f-display);font-weight:700;font-size:30px;text-transform:uppercase;line-height:1}
.dayttl .tot{text-align:right}.dayttl .tot b{font-family:var(--f-display);font-size:24px;display:block;line-height:1}.dayttl .tot span{font-size:12px;color:var(--muted)}
.band{border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:5px}
.band.jjb{background:var(--jjb-soft);border:1.5px solid var(--jjb)} .band.muscu{background:var(--muscu-soft);border:1.5px solid var(--muscu)}
.band.walk{background:var(--walk-soft);border:1.5px solid var(--walk)} .band.deload{background:var(--deload-soft);border:1.5px solid var(--deload)}
.band .top{display:flex;align-items:center;gap:9px;flex-wrap:wrap}
.ic{font-family:var(--f-display);font-size:14px;letter-spacing:.06em;padding:2px 8px;border-radius:6px;color:var(--code-ink);background:var(--bc)}
.band.jjb .ic{--bc:var(--jjb)} .band.muscu .ic{--bc:var(--muscu)} .band.walk .ic{--bc:var(--walk)} .band.deload .ic{--bc:var(--deload)}
.band .bt{font-family:var(--f-display);font-weight:700;font-size:22px;line-height:1;text-transform:uppercase}
.band .tm{font-weight:700;font-size:14px}
.band p{margin:0;font-size:14px}
.meal{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--cc,var(--line));border-radius:12px;padding:10px 13px 11px;text-align:left;width:100%;cursor:pointer;display:flex;flex-direction:column;gap:4px}
.meal.static{cursor:default}
.meal .k{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.meal .k .lbl{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.meal .n{font-size:16px;font-weight:700;line-height:1.25}
.meal .m{font-size:12.5px;color:var(--muted)}
.meal .x{font-size:13px;background:var(--surface2);border-radius:7px;padding:5px 8px;margin-top:2px}
.tag{font-size:11.5px;font-weight:700;padding:2px 8px;border-radius:999px}
.tag.before{background:var(--jjb-soft);color:var(--jjb)} .tag.after{background:var(--walk-soft);color:var(--ok)} .tag.mus{background:var(--muscu-soft);color:var(--muscu)}
.ti{display:grid;grid-template-columns:52px minmax(0,1fr);gap:10px}
.ti .t{font-family:var(--f-display);font-weight:700;font-size:18px;text-align:right;padding-top:10px;font-variant-numeric:tabular-nums}
.ex{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px 14px;display:flex;flex-direction:column;gap:8px}
.ex .h{display:flex;gap:10px;align-items:flex-start}
.ex .no{font-family:var(--f-display);font-weight:700;font-size:22px;line-height:1;color:var(--muscu);min-width:20px}
.ex .nm{font-weight:700;font-size:16.5px;line-height:1.25}
.ex .tg{font-family:var(--f-display);font-weight:700;font-size:19px;line-height:1.1;margin-top:2px}
.ex .tg small{font-family:var(--f-body);font-size:12px;font-weight:600;color:var(--muted);margin-left:6px}
.ex .cue{font-size:13.5px;color:var(--muted)}
.ex select{width:auto;max-width:100%;padding:4px 8px;font-size:13px;margin-top:4px}
.sets{display:grid;grid-template-columns:repeat(auto-fill,minmax(62px,1fr));gap:6px}
.set{display:flex;flex-direction:column;gap:2px}
.set label{font-size:10.5px;font-weight:700;color:var(--muted);text-transform:uppercase}
.set input{padding:8px 4px;font-family:var(--f-display);font-weight:700;font-size:20px;text-align:center}
.set input:not(:placeholder-shown){border-color:var(--ok)}
.last{font-size:12.5px;color:var(--muted)} .last b{color:var(--ink)}
.goal{font-size:12.5px;font-weight:700;color:var(--ok)}
.warm{background:var(--surface);border:1px dashed var(--line);border-radius:12px;padding:12px 14px}
.warm ol{margin:6px 0 0;padding-left:20px;font-size:14px}
.rest{position:sticky;top:calc(env(safe-area-inset-top,0px) + 6px);z-index:4;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px 10px;display:flex;align-items:center;gap:8px;justify-content:space-between;box-shadow:var(--shadow)}
.rest .t{font-family:var(--f-display);font-weight:700;font-size:26px;min-width:64px;text-align:center}
.rest .t.done{color:var(--ok)}
.rest .btn{padding:6px 11px}
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px}
@media (max-width:1000px){.week{grid-template-columns:1fr}}
.wd{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:6px;min-width:0;text-align:left}
.wd.cur{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.wd b{font-family:var(--f-display);font-size:18px;text-transform:uppercase}
.wl{display:grid;grid-template-columns:40px minmax(0,1fr);gap:6px;text-align:left;background:none;border:0;padding:4px 0;cursor:pointer;border-top:1px dashed var(--line)}
.wl .tm{font-size:11.5px;font-weight:700;color:var(--muted)}
.wl .nm{font-size:13px;line-height:1.3;font-weight:600}
.wl .nm .code{margin-right:4px;font-size:11px}
.wl .nm em{display:block;font-style:normal;font-weight:500;color:var(--muted);font-size:12px}
.ws{border-radius:8px;padding:6px 8px;font-size:13px;font-weight:600}
.ws.j{background:var(--jjb-soft);color:var(--jjb)} .ws.m{background:var(--muscu-soft);color:var(--muscu)} .ws.w{background:var(--walk-soft);color:var(--walk)}
.ws small{display:block;font-weight:500;color:var(--muted);font-size:12px}
.kc{font-size:12px;color:var(--muted);margin-top:auto;padding-top:4px;border-top:1px solid var(--line)}
.rgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:10px}
.rcard{background:var(--surface);border:1px solid var(--line);border-top:4px solid var(--cc);border-radius:12px;padding:12px 14px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:5px}
.rcard .n{font-weight:700;font-size:15px;line-height:1.25}
.rcard .m{font-size:12.5px;color:var(--muted)}
.secttl{font-family:var(--f-display);font-weight:700;font-size:20px;text-transform:uppercase;margin:18px 0 8px}
.shop{columns:2 300px;column-gap:14px}
.ray{break-inside:avoid;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px 12px;margin-bottom:12px}
.ray h3{font-size:12px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);margin:4px 0}
.chk{display:grid;grid-template-columns:24px minmax(0,1fr) auto;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--line);cursor:pointer}
.chk:first-of-type{border-top:0}
.chk input{width:20px;height:20px;accent-color:var(--ok);margin:0}
.chk .q{font-size:12.5px;color:var(--muted);text-align:right}
.chk.done .nm{text-decoration:line-through;color:var(--muted)}
.prog{height:8px;border-radius:99px;background:var(--surface2);border:1px solid var(--line);overflow:hidden;margin:6px 0 4px}
.prog i{display:block;height:100%;background:var(--ok)}
.cal{width:100%;border-collapse:collapse;font-size:13.5px}
.cal td{padding:5px 6px;border-bottom:1px solid var(--line)}
.cal tr.now td{background:var(--surface2);font-weight:700}
.calwrap{max-height:320px;overflow:auto}
ol.steps{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px;font-size:14px}
.chart{width:100%;height:auto;display:block}
.verdict{border-radius:10px;padding:10px 12px;font-size:14px;font-weight:600}
.verdict.ok{background:var(--walk-soft);color:var(--ok)} .verdict.warn{background:var(--muscu-soft);color:var(--warn)} .verdict.info{background:var(--surface2);color:var(--muted)}
table.log{border-collapse:collapse;width:100%;font-size:13.5px}
table.log td,table.log th{padding:6px 8px;border-bottom:1px solid var(--line);text-align:left}
table.log th{font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
table.log button{border:0;background:none;color:var(--muted);cursor:pointer;font-size:13px}
.morelist{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.morelist a{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;text-decoration:none;color:var(--ink);display:flex;flex-direction:column;gap:4px}
.morelist a b{font-family:var(--f-display);font-size:22px;text-transform:uppercase}
.morelist a span{font-size:13px;color:var(--muted)}
/* fiche */
.sheet-bg{position:fixed;inset:0;background:rgba(8,6,8,.55);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);color:var(--ink);width:min(720px,100%);max-height:88vh;overflow:auto;border-radius:16px 16px 0 0;padding:18px max(18px,env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px));border-top:5px solid var(--cc)}
@media (min-width:760px){.sheet-bg{align-items:center}.sheet{border-radius:16px}}
.sheet .x{float:right;border:1px solid var(--line);background:var(--surface2);border-radius:99px;width:34px;height:34px;cursor:pointer}
.sheet h2{font-size:21px;line-height:1.2;margin:6px 0 4px}
.ings{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:4px 16px;background:var(--surface2);border-radius:10px;padding:10px 12px;font-size:14px;margin:8px 0 12px}
@media (max-width:480px){.ings{grid-template-columns:1fr}}
.ings div{display:grid;grid-template-columns:96px minmax(0,1fr);gap:8px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

<script>
(function(){
"use strict";
/* ============ OUTILS DATES ============ */
const D = (y,m,d) => new Date(y,m-1,d);
const iso = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
const fromIso = s => { const [y,m,d] = s.split("-").map(Number); return D(y,m,d); };
const add = (d,n) => { const x = new Date(d); x.setDate(x.getDate()+n); return x; };
const day0 = d => new Date(d.getFullYear(), d.getMonth(), d.getDate());
const monday = d => add(day0(d), -((d.getDay()+6)%7));
const fmtLong = d => d.toLocaleDateString("fr-FR",{weekday:"long",day:"numeric",month:"long"});
const fmtShort = d => d.toLocaleDateString("fr-FR",{day:"numeric",month:"short"});
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const JOURS = ["Dimanche","Lundi","Mardi","Mercredi","Jeudi","Vendredi","Samedi"];
const JC = ["Dim","Lun","Mar","Mer","Jeu","Ven","Sam"];
const today = () => day0(new Date());
const uid = () => Math.random().toString(36).slice(2,10) + Date.now().toString(36).slice(-4);

/* ============ STOCKAGE LOCAL ============ */
const KEY = "kuroro-app-v1";
const DEFAULT_HABITS = [{id:"pesee",n:"Pesée à jeun"},{id:"pas",n:"8 000 pas"},{id:"eau",n:"Boire 2 L d'eau"},{id:"coucher",n:"Coucher tôt"}];
const DEFAULT_TASKS = [];
function fresh(){ return {v:1, created:iso(today()), logs:{}, choice:{}, weights:{}, waist:{}, tasks:DEFAULT_TASKS.slice(), habits:DEFAULT_HABITS.slice(), prog:null, hdone:{}, notes:[], courses:{}}; }
let S;
try { S = JSON.parse(localStorage.getItem(KEY) || "null"); } catch(e){ S = null; }
if (!S || !S.v) S = fresh();
let storageOk = true;
function save(){ try { localStorage.setItem(KEY, JSON.stringify(S)); storageOk = true; } catch(e){ storageOk = false; toast("Impossible d'enregistrer sur cet appareil"); } }
save();
let toastT = null;
function toast(msg){ const t = document.getElementById("toast"); t.textContent = msg; t.hidden = false; clearTimeout(toastT); toastT = setTimeout(()=> t.hidden = true, 2200); }

/* ============ PLAN REPAS ============ */
let DATA = {recipes:[], weeks:{}, desserts:[]}; const R = {}; let P = null;
const CAT = {batch:["Batch","--c-batch"],dimanche:["Midi du dimanche","--c-dim"],diner:["Dîner","--c-diner"],collation:["Collation","--c-snack"],plaisir:["Repas plaisir","--c-plaisir"],express:["Express (stock)","--c-express"]};
let M_START, VOY0, VOY1, TRANS0, GOAL;
let MT = {};
let CLOSE = {};
let TR = {};
function mealPlan(d){
  d = day0(d); if (d < TRANS0) d = TRANS0;
  const k = iso(d);
  if (TR[k]) return {kind:"trans", t:TR[k]};
  if (d >= VOY0 && d <= VOY1) return {kind:"voyage"};
  const idx = Math.floor((d - M_START) / 864e5 / 7 + 1e-9);
  const w = ((idx % 4) + 4) % 4 + 1, di = d.getDay();
  return {kind:"cycle", w, di, day:DATA.weeks[w].days[di]};
}
const cc = code => `var(${CAT[R[code].cat][1]})`;
const codeChip = code => `<span class="code" style="--cc:${cc(code)}">${code}</span>`;
const tags = list => (list||[]).map(([k,t]) => `<span class="tag ${k}">${esc(t)}</span>`).join("");

/* ============ PLAN SPORT ============ */
const WARMUP = ["10 grands cercles de bras dans chaque sens","10 squats au poids du corps","10 pompes mains surélevées","30 s de jumping jacks","1 série légère du premier exercice"];
const SESS = {
 A:{name:"Muscu A", sub:"Haut du corps", ex:[
  {id:"a1", v:[{n:"Rowing unilatéral haltère", r:"15-20 par bras", u:"reps"},{n:"Tractions", r:"max - 2", u:"reps"}], sets:4, c:"Rowing : main et genou sur une chaise, dos plat, coude vers la hanche ; 3 s en descente, 1 s de pause en haut. Tractions : moins de 5 reps → négatives de 5 s."},
  {id:"a2", v:[{n:"Pompes pieds surélevés", r:"12-25", u:"reps"}], sets:4, c:"Pieds sur une chaise, corps gainé, coudes à 45° ; 3 s en descente, poitrine au sol."},
  {id:"a3", v:[{n:"Développé épaules haltères, assis au sol", r:"15-20", u:"reps"}], sets:3, c:"Dos droit, pousse sans cambrer, sans élan."},
  {id:"a4", v:[{n:"Pompes serrées", r:"10-20", u:"reps"},{n:"Dips (station)", r:"10-20", u:"reps"}], sets:3, c:"Coudes le long du corps. Dips : buste un peu penché, 90° aux coudes. Proche de l'échec."},
  {id:"a5", v:[{n:"Élévations latérales", r:"15-20 + 1 dégressive", u:"reps"}], sets:3, c:"Coudes légèrement fléchis, monte à hauteur d'épaules. Dernière série : continue à 5 kg jusqu'à l'échec."},
  {id:"a6", v:[{n:"Curl marteau", r:"12-15", u:"reps"}], sets:3, c:"Prise neutre, coudes fixes, 3 s en descente."},
  {id:"a7", v:[{n:"Hollow body hold", r:"30-45 s", u:"s"}], sets:3, c:"Bas du dos plaqué, bras et jambes tendus décollés."}
 ]},
 B:{name:"Muscu B", sub:"Bas du corps + gainage", ex:[
  {id:"b1", v:[{n:"Squat bulgare (2 × 10 kg)", r:"10-15 par jambe", u:"reps"}], sets:4, c:"Pied arrière sur une chaise, genou arrière vers le sol en 3 s."},
  {id:"b2", v:[{n:"Soulevé de terre roumain unijambe", r:"10-12 par jambe", u:"reps"}], sets:4, c:"Jambe d'appui légèrement fléchie, dos plat, hanches alignées."},
  {id:"b3", v:[{n:"Goblet squat « 1 et demi »", r:"12-15", u:"reps"}], sets:3, c:"Descends, remonte à mi-chemin, redescends, remonte = 1 rep."},
  {id:"b4", v:[{n:"Hip thrust unilatéral", r:"15-20 par jambe", u:"reps"}], sets:3, c:"Haut du dos sur le canapé, 2 s de contraction en haut."},
  {id:"b5", v:[{n:"Mollets unilatéraux sur une marche", r:"15-25", u:"reps"}], sets:3, c:"Pause 1 s en bas, monte le plus haut possible."},
  {id:"b6", v:[{n:"Dead bug", r:"10 par côté", u:"reps"}], sets:3, c:"Dos plaqué, bras et jambe opposés, lentement."},
  {id:"b7", v:[{n:"Marche du fermier (1 haltère)", r:"40 m par côté", u:"m"}], sets:3, c:"Un haltère d'un seul côté, marche droit sans pencher."}
 ]},
 M:{name:"Circuit voyage", sub:"Poids du corps · 20 min", ex:[
  {id:"m1", v:[{n:"Pompes", r:"15", u:"reps"}], sets:3, c:"Corps gainé."},
  {id:"m2", v:[{n:"Squats", r:"20", u:"reps"}], sets:3, c:"Cuisses parallèles au sol."},
  {id:"m3", v:[{n:"Fentes alternées", r:"10 par jambe", u:"reps"}], sets:3, c:"Genou arrière près du sol."},
  {id:"m4", v:[{n:"Hip thrust au sol", r:"15", u:"reps"}], sets:3, c:"Pousse avec les talons."},
  {id:"m5", v:[{n:"Gainage planche", r:"30-45 s", u:"s"}], sets:3, c:"Fesses alignées, ventre rentré."}
 ]}
};
let JJB = {};
let S_START, S_VOY0, S_VOY1, CYCLE0;
function phaseOf(d){
  d = day0(d);
  if (d < S_VOY0) return {k:"start", label:"Démarrage sport", hint:"Fais chaque exercice proprement et note tes reps : ce sont tes chiffres de départ."};
  if (d <= S_VOY1) return {k:"voyage", label:P.voyage.label, hint:"Circuit au poids du corps 3 fois dans la semaine, et beaucoup de marche."};
  const idx = Math.floor((monday(d) - CYCLE0) / 864e5 / 7 + 1e-9);
  const cyc = Math.floor(idx/4)+1, w = idx%4+1, deload = w===4;
  const hint = deload ? "Semaine allégée : 2 séries par exercice, loin de l'échec. JJB plutôt technique." : w===1 ? "Semaine 1 du cycle : reprends tes chiffres et vise le haut de la fourchette." : "Ajoute 1 à 2 reps par série par rapport à la semaine dernière.";
  return {k: deload?"deload":"cycle", cyc, w, deload, label: deload ? `Cycle ${cyc} · semaine allégée` : `Cycle ${cyc} · semaine ${w}`, hint};
}
function sessionsOf(d){
  const ph = phaseOf(d), wd = d.getDay(), out = [];
  if (ph.k==="voyage"){
    if (wd===2 || wd===4 || wd===6) out.push({k:"muscu", s:"M", t:"07:30", e:"08:00"});
    out.push({k:"walk", n:"Marche", t:null, d:"30-60 min, profite des visites"});
    return out;
  }
  if (JJB[wd]) out.push({k:"jjb", ...JJB[wd]});
  (P.muscu||[]).forEach(m => { if (wd===m.day) out.push({k:"muscu", s:m.s, t:m.t, e:m.e}); });
  (P.marche||[]).forEach(m => { if (wd===m.day) out.push({k:"walk", n:"Marche", t:m.t, d:m.d}); });
  return out;
}

/* ============ JOURNÉE FUSIONNÉE (accueil) ============ */
function dayItems(d){
  const items = [], mp = mealPlan(d), wd = d.getDay();
  sessionsOf(d).forEach(s => {
    if (s.k==="jjb") items.push({t:s.t||"14:00", lab: s.t?`${s.t.replace(":","h")}`:"Samedi", x:`JJB${s.t?" · "+s.t+"-"+s.e:""}`, sub:s.f, cc:"var(--jjb)", go:"#sport"});
    if (s.k==="muscu") items.push({t:s.t, lab:s.t.replace(":","h"), x:`${SESS[s.s].name} · ${SESS[s.s].sub}`, sub:phaseOf(d).deload?"Semaine allégée : 2 séries":"Note tes reps dans Sport", cc:"var(--muscu)", go:"#sport"});
    if (s.k==="walk") items.push({t:s.t||"15:00", lab:s.t?s.t.replace(":","h"):"", x:s.n, sub:s.d, cc:"var(--walk)", go:"#sport"});
  });
  if (wd===0 && mp.kind==="cycle") items.push({t:"11:00", lab:"11h", x:"Batch cooking", sub:"6 boîtes pour la semaine", cc:"var(--c-batch)", go:"#repas"});
  if (mp.kind==="cycle"){
    const mt = MT[wd];
    items.push({t:mt.l[0], lab:mt.l[0].replace(":","h"), x:R[mp.day.lunch].name, sub:(mt.l[1][0]||[])[1]||"Repas 1", code:mp.day.lunch});
    items.push({t:mt.s[0], lab:mt.s[0].replace(":","h"), x:R[mp.day.snack].name, sub:(mt.s[1][0]||[])[1]||"Collation", code:mp.day.snack});
    items.push({t:mt.d[0], lab:mt.d[0].replace(":","h"), x:R[mp.day.dinner].name, sub:[(mt.d[1][0]||[])[1], mp.day.dessert?"dessert : "+mp.day.dessert:""].filter(Boolean).join(" · "), code:mp.day.dinner});
  } else if (mp.kind==="trans"){
    const t = mp.t, mt = MT[wd];
    items.push(t.l ? {t:"12:00", lab:"12h", x:R[t.l[0]].name, sub:t.l[1]||"Repas 1", code:t.l[0]} : {t:"12:00", lab:"12h", x:t.lt||"Repas 1 comme d'habitude", sub:"", cc:"var(--muted)"});
    items.push(t.d ? {t:mt.d[0], lab:mt.d[0].replace(":","h"), x:R[t.d[0]].name, sub:t.d[1]||"Dîner", code:t.d[0]} : {t:mt.d[0], lab:mt.d[0].replace(":","h"), x:t.dt||"Dîner", sub:"", cc:"var(--muted)"});
  }
  items.sort((a,b) => a.t.localeCompare(b.t));
  return items;
}

/* ============ VUES : ACCUEIL ============ */
function habitDone(date, id){ return !!(S.hdone[date] && S.hdone[date][id]); }
function streak(id){ let n = 0, d = today(); if (!habitDone(iso(d), id)) d = add(d,-1); while (habitDone(iso(d), id)){ n++; d = add(d,-1); } return n; }
function windowAvg(end, days){ const v = []; for (let i=0;i<days;i++){ const k = iso(add(end,-i)); if (S.weights[k]!=null) v.push(+S.weights[k]); } return v.length ? v.reduce((a,b)=>a+b,0)/v.length : null; }
const f1 = v => v==null ? "–" : v.toFixed(1).replace(".",",");
function sparkline(){
  const ks = Object.keys(S.weights).sort().slice(-30); if (ks.length < 2) return `<p class="note" style="margin:8px 0 0">La courbe apparaît dès 2 pesées.</p>`;
  const vals = ks.map(k=>+S.weights[k]), lo = Math.min(...vals)-.5, hi = Math.max(...vals)+.5, W = 300, H = 60;
  const pts = vals.map((v,i)=>`${(i/(vals.length-1)*W).toFixed(1)},${(H-(v-lo)/(hi-lo)*H).toFixed(1)}`);
  return `<svg class="chart" viewBox="-4 -4 ${W+8} ${H+8}" role="img" aria-label="Évolution du poids sur les dernières pesées" style="margin-top:8px"><polyline points="${pts.join(" ")}" fill="none" stroke="var(--accent)" stroke-width="2.5"/><circle cx="${pts[pts.length-1].split(",")[0]}" cy="${pts[pts.length-1].split(",")[1]}" r="4" fill="var(--accent)"/></svg>`;
}
function weekBars(){
  const end = today(); let s = "";
  const W = 300, H = 70, bw = 30, gap = (W - 7*bw)/6;
  for (let i=6;i>=0;i--){
    const d = add(end,-i), k = iso(d), n = S.habits.filter(h=>habitDone(k,h.id)).length, tot = S.habits.length || 1;
    const h = Math.max(2, n/tot*(H-16)), x = (6-i)*(bw+gap);
    s += `<rect x="${x.toFixed(1)}" y="${(H-16-h).toFixed(1)}" width="${bw}" height="${h.toFixed(1)}" rx="5" fill="${n===tot?"var(--ok)":"var(--accent)"}" opacity="${n?1:.25}"/><text x="${(x+bw/2).toFixed(1)}" y="${H-2}" text-anchor="middle" font-size="11" fill="var(--muted)">${JC[d.getDay()]}</text>`;
  }
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Habitudes cochées sur les 7 derniers jours">${s}</svg>`;
}
function viewAccueil(){
  const d = today(), k = iso(d), items = dayItems(d);
  const now = new Date(), hm = `${String(now.getHours()).padStart(2,"0")}:${String(now.getMinutes()).padStart(2,"0")}`;
  const next = items.find(i => i.t >= hm);
  const ph = phaseOf(d), mp = mealPlan(d);
  const mealChip = mp.kind==="cycle" ? `Repas · semaine ${mp.w}` : mp.kind==="trans" ? "Repas · avec ton stock" : P.voyage.label;
  const late = S.tasks.filter(t => !t.done && t.due && t.due < k), due = S.tasks.filter(t => !t.done && t.due===k);
  const hdoneN = S.habits.filter(h=>habitDone(k,h.id)).length;
  const lastK = Object.keys(S.weights).sort().pop();
  const a7 = windowAvg(d,7), a7p = windowAvg(add(d,-7),7);
  const seancesWeek = (() => { const m = monday(d); let n = 0; for (let i=0;i<7;i++){ const dk = iso(add(m,i)); if (Object.keys(S.logs).some(x => x.startsWith(dk+":") && Object.values(S.logs[x]).some(e => (e.r||[]).some(v=>v!==""&&v!=null)))) n++; } return n; })();
  return `
  <div class="hello"><div><h1>Salut ${esc(P.prenom)}</h1><div class="d">${fmtLong(d)}</div></div>
    <div style="display:flex;flex-direction:column;gap:5px;align-items:flex-end"><span class="chip ${ph.deload?"deload":""}">${esc(ph.label)}</span><span class="chip">${esc(mealChip)}</span></div></div>
  ${next ? `<button class="next" data-href="${next.go||"#repas"}"><div class="t num">${esc(next.lab)}</div><div><div class="l">À suivre</div><div class="n">${esc(next.x)}</div></div></button>` : `<div class="next" style="cursor:default"><div><div class="l">Journée terminée</div><div class="n">Repos, écrans off vers 22h45.</div></div></div>`}
  <div class="grid2">
    <div class="stack">
      <div class="panel"><h3>Ta journée <button class="link" data-href="#repas">Détails</button></h3><div class="tl">
        ${items.map(i => `<button class="tlr ${i.t < hm ? "past":""}" ${i.code?`data-r="${i.code}"`:`data-href="${i.go||"#accueil"}"`} style="--cc:${i.code?cc(i.code):i.cc}"><span class="t">${esc(i.lab)}</span><span class="dot"></span><span class="x">${esc(i.x)}${i.sub?`<small>${esc(i.sub)}</small>`:""}</span></button>`).join("") || `<p class="note">Rien de prévu.</p>`}
      </div></div>
      <div class="panel"><h3>Habitudes <span class="num muted" style="font-size:13px">${hdoneN}/${S.habits.length}</span></h3>
        <div class="hab">${S.habits.map(h => `<button class="hbtn" data-habit="${h.id}" data-date="${k}" aria-pressed="${habitDone(k,h.id)}"><span class="ck">${habitDone(k,h.id)?"✓":""}</span>${esc(h.n)}</button>`).join("")}</div>
        <div style="margin-top:12px">${weekBars()}</div></div>
    </div>
    <div class="stack">
      <div class="panel"><h3>Tâches du jour <button class="link" data-href="#taches">Toutes</button></h3>
        ${[...late, ...due].map(taskRow).join("") || `<p class="note" style="margin:0">Rien pour aujourd'hui.</p>`}
        <form class="qw" data-form="quicktask"><input type="text" id="qt" placeholder="Ajouter une tâche pour aujourd'hui" aria-label="Nouvelle tâche"><button class="btn primary" type="submit">Ajouter</button></form></div>
      <div class="panel"><h3>Poids <button class="link" data-href="#suivi">Suivi</button></h3>
        <div class="kpis"><div class="kpi"><b class="num">${lastK?f1(+S.weights[lastK]):"–"}</b><span>dernière pesée</span></div><div class="kpi"><b class="num">${f1(a7)}</b><span>moyenne 7 j</span></div><div class="kpi"><b class="num">${a7!=null&&a7p!=null?(a7-a7p>0?"+":"")+f1(a7-a7p):"–"}</b><span>vs semaine d'avant</span></div></div>
        ${sparkline()}
        <form class="qw" data-form="quickweight"><input type="number" id="qwkg" step="0.1" min="40" max="250" inputmode="decimal" placeholder="Poids de ce matin (kg)" aria-label="Poids de ce matin en kg"><button class="btn primary" type="submit">Noter</button></form></div>

function chartSVG(){
  const ks = Object.keys(S.weights).sort(); if (ks.length < 2) return `<p class="note">La courbe apparaît dès 2 pesées.</p>`;
  const W = 480, H = 280, L = 40, Rr = 10, T = 12, B = 30, d0 = fromIso(ks[0]);
  const vals = ks.map(k=>+S.weights[k]);
  const lo = Math.floor(Math.min(...vals,P.poids.bas)-1), hi = Math.ceil(Math.max(...vals)+1);
  const x = d => L + (W-L-Rr) * ((d-d0)/(GOAL-d0)), y = v => T + (H-T-B) * (1-(v-lo)/(hi-lo));
  let g = ""; const step = (hi-lo) > 12 ? 4 : 2;
  for (let v = Math.ceil(lo/step)*step; v <= hi; v += step) g += `<line x1="${L}" x2="${W-Rr}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)"/><text x="${L-6}" y="${y(v)+4}" text-anchor="end" font-size="13" fill="var(--muted)">${v}</text>`;
  (()=>{const a=[];let m=new Date(d0.getFullYear(),d0.getMonth()+1,1);while(m<GOAL){a.push(new Date(m));m.setMonth(m.getMonth()+1);}return a;})().forEach(m=>{ if (m>d0) g += `<text x="${x(m)}" y="${H-8}" text-anchor="middle" font-size="12" fill="var(--muted)">${fmtShort(m)}</text>`; });
  g += `<rect x="${x(GOAL)-6}" y="${y(P.poids.haut)}" width="6" height="${y(P.poids.bas)-y(P.poids.haut)}" fill="var(--ok)" opacity=".5"/><line x1="${x(d0)}" y1="${y(vals[0])}" x2="${x(GOAL)}" y2="${y(P.poids.cible)}" stroke="var(--ok)" stroke-dasharray="5 5" stroke-width="1.5"/>`;
  const pts = ks.map(k=>`${x(fromIso(k)).toFixed(1)},${y(+S.weights[k]).toFixed(1)}`);
  g += `<polyline points="${pts.join(" ")}" fill="none" stroke="var(--accent)" stroke-width="2"/>` + ks.map((k,i)=>`<circle cx="${x(fromIso(k))}" cy="${y(+S.weights[k])}" r="${i===ks.length-1?4.5:2.5}" fill="var(--accent)"/>`).join("");
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Courbe de poids jusqu'à l'objectif">${g}</svg><p class="note">Pointillés : trajectoire vers ${P.poids.cible} kg le ${fmtShort(GOAL)}. Barre verte : zone visée ${P.poids.bas}-${P.poids.haut} kg.</p>`;
}

  const a7 = windowAvg(today(),7), a7p = windowAvg(add(today(),-7),7), a14p = windowAvg(add(today(),-14),7);

    <div class="grid2"><div class="panel"><h3>Ajouter une mesure</h3><form data-form="measure" class="stack"><input type="date" id="f-date" value="${iso(today())}" aria-label="Date" required>

function backupText(){ return JSON.stringify({app:"kuroro", exported:new Date().toISOString(), data:S}); }
async function doExport(mode){
  const txt = backupText(), name = `kuroro-sauvegarde-${iso(today())}.json`;
  if (mode==="claude" || mode==="copy"){ try { await navigator.clipboard.writeText(txt); toast("Copié : colle-le dans ta conversation avec Claude"); } catch(e){ const ta = document.getElementById("imp-text"); ta.value = txt; ta.focus(); ta.select(); toast("Sélectionne le texte et copie-le"); } return; }
  try { const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([txt],{type:"application/json"})); a.download = name; document.body.appendChild(a); a.click(); setTimeout(()=>{URL.revokeObjectURL(a.href); a.remove();}, 1000); toast("Sauvegarde téléchargée"); }
  catch(e){ toast("Téléchargement impossible ici : utilise « Copier le texte »"); }
}
let pendingImport = null;
function doImport(txt){
  let o; try { o = JSON.parse(txt.slice(txt.indexOf("{"), txt.lastIndexOf("}")+1)); } catch(e){ toast("Texte non reconnu : copie-le en entier"); return; }
  if (o && o.app==="kuroro-programme") return loadProgramme(o);
  if (o && o.app==="kuroro-patch"){ if (!P){ toast("Importe d'abord ton programme"); return; } return applyPatch(o); }
  const d = o && (o.data || o);
  if (!d || !d.v){ toast("Ce texte n'est pas une sauvegarde Kuroro"); return; }
  if (!P){ S = Object.assign(fresh(), d); save(); initProg(); toast("Sauvegarde restaurée"); render(); return; }
  pendingImport = {data:d, exported:o.exported}; location.hash = "reglages"; render(); window.scrollTo(0,0);
}
function applyPatch(p){
  let n = 0; const now = new Date().toISOString();
  const findTask = o => S.tasks.find(x => (o.id && x.id===o.id) || (o.t && x.t.toLowerCase()===String(o.t).toLowerCase()));
  (p.ops||[]).forEach(o => {
    try { switch(o.op){
      case "addTask": S.tasks.push({id:uid(), t:String(o.t), due:o.due||null, cat:o.cat||"Perso", done:false}); n++; break;
      case "doneTask": { const x = findTask(o); if (x){ x.done = true; x.doneAt = iso(today()); n++; } break; }
      case "editTask": { const x = findTask(o); if (x){ if (o.newT) x.t = o.newT; if ("due" in o) x.due = o.due; if (o.cat) x.cat = o.cat; n++; } break; }
      case "delTask": { const x = findTask(o); if (x){ S.tasks = S.tasks.filter(y=>y!==x); n++; } break; }
      case "addNote": S.notes.push({id:uid(), title:o.title||"", body:o.body||"", upd:now}); n++; break;
      case "addHabit": if (!S.habits.some(h=>h.n===o.n)){ S.habits.push({id:uid(), n:String(o.n)}); n++; } break;
      case "delHabit": { const before = S.habits.length; S.habits = S.habits.filter(h=>h.n!==o.n && h.id!==o.id); n += before - S.habits.length; break; }
      case "setWeight": if (o.date && o.kg!=null){ S.weights[o.date] = +o.kg; n++; } break;
      case "delWeight": if (o.date){ delete S.weights[o.date]; n++; } break;
      case "setWaist": if (o.date && o.cm!=null){ S.waist[o.date] = +o.cm; n++; } break;
      case "setLog": if (o.date && o.sess && o.ex && Array.isArray(o.r)){ const k = logKey(o.date,o.sess); S.logs[k] = S.logs[k] || {}; S.logs[k][o.ex] = {r:o.r.map(String), v:o.v||0}; n++; } break;
    } } catch(e){}
  });
  save(); toast(`${n} modification${n>1?"s":""} appliquée${n>1?"s":""}`); location.hash = "accueil"; render();
}

let restEnd = 0, restTick = null, actx = null;
function beep(){ try { actx = actx || new (window.AudioContext||window.webkitAudioContext)(); const o = actx.createOscillator(), g = actx.createGain(); o.frequency.value = 880; o.connect(g); g.connect(actx.destination); g.gain.setValueAtTime(.2, actx.currentTime); g.gain.exponentialRampToValueAtTime(.001, actx.currentTime+.5); o.start(); o.stop(actx.currentTime+.5); } catch(e){} try { navigator.vibrate && navigator.vibrate([200,100,200]); } catch(e){} }
function startRest(s){
  clearInterval(restTick); const el = () => document.getElementById("tleft");
  if (!el()) return; el().classList.remove("done");
  if (!s){ el().textContent = "–"; return; }
  try { actx = actx || new (window.AudioContext||window.webkitAudioContext)(); } catch(e){}
  restEnd = Date.now() + s*1000;
  const tick = () => { const e = el(); if (!e){ clearInterval(restTick); return; } const left = Math.max(0, Math.round((restEnd-Date.now())/1000)); e.textContent = left+" s"; if (!left){ clearInterval(restTick); e.textContent = "Go !"; e.classList.add("done"); beep(); } };
  tick(); restTick = setInterval(tick, 250);
}

document.addEventListener("click", e => {

  if (ds.go){ sel = fromIso(ds.go); if (ds.sub) sportTab = ds.sub; render(); return; }
  if (ds.shift){ sel = add(sel, +ds.shift); render(); return; }
  if (ds.st){ sportTab = ds.st; render(); return; }
  if (ds.rt){ repasTab = ds.rt; render(); return; }
  if (ds.wk){ wsel = ds.wk; render(); return; }
  if (ds.rf){ rfilter = ds.rf; render(); return; }
  if (ds.sw){ ssel = +ds.sw; confirmReset = false; render(); return; }
  if (ds.goshop){ ssel = +ds.goshop; repasTab = "courses"; render(); return; }
  if (t.id==="reset"){ if (!confirmReset){ confirmReset = true; render(); return; } S.courses["s"+ssel] = {}; confirmReset = false; save(); render(); return; }
  if (ds.habit){ const d = ds.date; S.hdone[d] = S.hdone[d] || {}; if (S.hdone[d][ds.habit]) delete S.hdone[d][ds.habit]; else S.hdone[d][ds.habit] = 1; save(); render(); return; }
  if (ds.deltask){ S.tasks = S.tasks.filter(x=>x.id!==ds.deltask); save(); render(); toast("Tâche supprimée"); return; }
  if (ds.tf){ tfilter = ds.tf; render(); return; }
  if (ds.delhabit){ S.habits = S.habits.filter(h=>h.id!==ds.delhabit); save(); render(); return; }
  if (ds.newnote){ const n = {id:uid(), title:"", body:"", upd:new Date().toISOString()}; S.notes.push(n); save(); noteOpen = n.id; render(); setTimeout(()=>{ const i = document.getElementById("n-title"); i && i.focus(); }, 30); return; }
  if (ds.opennote){ noteOpen = ds.opennote; render(); return; }
  if (ds.closenote){ S.notes = S.notes.filter(n => n.title || n.body); save(); noteOpen = null; render(); return; }
  if (ds.delnote){ S.notes = S.notes.filter(n=>n.id!==ds.delnote); save(); noteOpen = null; render(); toast("Note supprimée"); return; }
  if (ds.delw){ delete S.weights[ds.delw]; delete S.waist[ds.delw]; save(); render(); return; }
  if (ds.export){ doExport(ds.export); return; }
  if (ds.confirmimport){ S = Object.assign(fresh(), pendingImport.data); pendingImport = null; save(); initProg(); toast("Sauvegarde restaurée"); location.hash = "accueil"; render(); return; }
  if (ds.cancelimport){ pendingImport = null; render(); return; }
  if (ds.importprog){ const v = document.getElementById("prog-text").value.trim(); if (v) doImport(v); return; }
  if (ds.import){ const v = document.getElementById("imp-text").value.trim(); if (v) doImport(v); return; }
  if (ds.wipe){ if (!confirmWipe){ confirmWipe = true; render(); return; } S = fresh(); save(); P = null; confirmWipe = false; toast("Appli remise à zéro"); render(); return; }
});
let saveT = null;
document.addEventListener("input", e => {
  const i = e.target;
  if (i.dataset.log){
    const key = logKey(i.dataset.date, i.dataset.sess), L = S.logs[key] = S.logs[key] || {};
    const ex = L[i.dataset.log] = L[i.dataset.log] || {r:[], v:S.choice[i.dataset.log] ?? 0};
    ex.r[+i.dataset.k] = i.value.replace(",",".").replace(/[^0-9.]/g,""); ex.v = S.choice[i.dataset.log] ?? 0;
    clearTimeout(saveT); saveT = setTimeout(save, 400); return;
  }
  if (i.dataset.note){ const n = S.notes.find(x=>x.id===i.dataset.note); if (!n) return; if (i.id==="n-title") n.title = i.value; else n.body = i.value; n.upd = new Date().toISOString(); noteOpen = n.id; clearTimeout(saveT); saveT = setTimeout(save, 400); return; }
  if (i.id==="n-q"){ nq = i.value; const pos = i.selectionStart; render(); const n = document.getElementById("n-q"); n.focus(); try{ n.setSelectionRange(pos,pos); }catch(e){} return; }
  if (i.id==="rsearch"){ rq = i.value; const pos = i.selectionStart; render(); const n = document.getElementById("rsearch"); n.focus(); try{ n.setSelectionRange(pos,pos); }catch(e){} return; }
});
document.addEventListener("change", e => {
  const t = e.target;
  if (t.dataset.task){ const x = S.tasks.find(k=>k.id===t.dataset.task); if (x){ x.done = t.checked; x.doneAt = t.checked ? iso(today()) : null; save(); setTimeout(render, 250); } return; }
  if (t.dataset.shopk){ const k = "s"+ssel; S.courses[k] = S.courses[k] || {}; if (t.checked) S.courses[k][t.dataset.shopk] = 1; else delete S.courses[k][t.dataset.shopk]; save(); render(); return; }
  if (t.dataset.variant){ S.choice[t.dataset.variant] = +t.value; save(); render(); return; }
  if ((t.id==="imp-file" || t.id==="prog-file") && t.files && t.files[0]){ const r = new FileReader(); r.onload = () => doImport(String(r.result)); r.readAsText(t.files[0]); return; }
});
document.addEventListener("submit", e => {
  const f = e.target.dataset.form; if (!f) return; e.preventDefault();
  if (f==="quicktask"){ const v = document.getElementById("qt").value.trim(); if (!v) return; S.tasks.push({id:uid(), t:v, due:iso(today()), cat:"Perso", done:false}); save(); render(); toast("Tâche ajoutée"); }
  if (f==="task"){ const v = document.getElementById("t-t").value.trim(); if (!v) return; S.tasks.push({id:uid(), t:v, due:document.getElementById("t-d").value || null, cat:document.getElementById("t-c").value, done:false}); save(); render(); toast("Tâche ajoutée"); }
  if (f==="habit"){ const v = document.getElementById("h-n").value.trim(); if (!v) return; S.habits.push({id:uid(), n:v}); save(); render(); }
  if (f==="quickweight"){ const kg = parseFloat(String(document.getElementById("qwkg").value).replace(",",".")); if (isNaN(kg)) return; const k = iso(today()); S.weights[k] = Math.round(kg*10)/10; S.hdone[k] = S.hdone[k] || {}; if (S.habits.some(h=>h.id==="pesee")) S.hdone[k].pesee = 1; save(); render(); toast("Pesée notée"); }
  if (f==="measure"){ const d = document.getElementById("f-date").value, kg = parseFloat(String(document.getElementById("f-kg").value).replace(",",".")), cm = parseFloat(String(document.getElementById("f-cm").value).replace(",",".")); if (!d || (isNaN(kg) && isNaN(cm))) return; if (!isNaN(kg)) S.weights[d] = Math.round(kg*10)/10; if (!isNaN(cm)) S.waist[d] = Math.round(cm*2)/2; save(); render(); toast("Mesure enregistrée"); }
});
document.addEventListener("keydown", e => { if (e.key==="Escape" && !sheet.hidden) closeSheet(); });
initProg();
render();
})();
</script>

<script>if("serviceWorker" in navigator){window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));}</script>
